name: Daily journal update
on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: r4-journal
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner.py daily
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Commit journal and dashboard
        run: |
          git config user.name "r4-bot"
          git config user.email "r4-bot@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git pull --rebase -X theirs origin ${{ github.ref_name }}
          git push
